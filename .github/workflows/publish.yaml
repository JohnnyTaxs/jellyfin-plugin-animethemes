name: '🚀 Publish Plugin'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example 7.0.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: AnimeThemes ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release/**/*.zip

      - name: Update plugin manifest
        if: ${{ !inputs.prerelease }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          zip_path="$(find release -type f -name '*.zip' -print -quit)"
          zip_name="$(basename "$zip_path")"
          version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)"
          checksum="$(md5sum "$zip_path" | cut -d ' ' -f 1)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${zip_name}"

          jq --arg checksum "$checksum" \
             --arg sourceUrl "$source_url" \
             --arg timestamp "$timestamp" \
             --arg version "$version" \
             '.[0].versions += [{
               checksum: $checksum,
               changelog: "Published from GitHub Actions",
               targetAbi: "10.11.3.0",
               sourceUrl: $sourceUrl,
               timestamp: $timestamp,
               version: $version
             }]' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git commit -m "Update manifest for ${version}" || true
          git push
